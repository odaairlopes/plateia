name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: the workflow only reads the code.
permissions:
  contents: read

# A new push to the same branch or PR supersedes the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24
  # npm audit and funding messages are noise in CI logs.
  npm_config_audit: false
  npm_config_fund: false

jobs:
  quality:
    name: Typecheck, format, lint, unit tests and build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Lowest supported version (package.json engines) and the current LTS.
        node: [22, 24]
    steps:
      # Actions are pinned to full commit SHAs: a tag can be moved, a SHA cannot.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Typecheck (strict, every workspace)
        run: npm run typecheck

      - name: Formatting (Prettier)
        run: npm run format:check

      # Oxlint with type-aware rules (tsgolint, on TypeScript 7). Findings show
      # up as annotations on the pull request diff.
      - name: Lint
        run: npm run lint -- --format=github

      - name: Unit tests
        run: npm test

      # The exact static site Vercel publishes (shell at /, remotes under /mf/*).
      - name: Build the production web site
        run: npm run build:web:prod

  smoke:
    name: Production image end to end (smoke + Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: plateia
          POSTGRES_PASSWORD: plateia
          POSTGRES_DB: plateia
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U plateia -d plateia"
          --health-interval 3s --health-timeout 3s --health-retries 20
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s --health-timeout 3s --health-retries 20
      # Captures the confirmation emails; the smoke test reads them back over its API.
      mailpit:
        image: axllent/mailpit:v1.34.0
        ports: ["1025:1025", "8025:8025"]
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # The same image Render builds and runs: the smoke test exercises the
      # production artifact (bundles, gateway, start script), not the sources.
      - name: Build the production image
        run: docker build -f deploy/backend/Dockerfile -t plateia-api:ci .

      - name: Start the production image
        # Throwaway values for the CI containers; nothing here is a real secret.
        run: |
          docker run -d --name api --network host --memory 512m \
            -e PORT=8080 \
            -e DATABASE_URL=postgres://plateia:plateia@localhost:5432/plateia \
            -e REDIS_URL=redis://localhost:6379 \
            -e SMTP_HOST=localhost -e SMTP_PORT=1025 \
            -e BACKOFFICE_JWT_SECRET=ci-only-secret-0123456789abcdef0123 \
            -e MAIL_RECIPIENT_HASH_SECRET=ci-only-hash-secret \
            -e PAYMENT_DELAY_MS=300 -e DB_POOL_MAX=3 -e LOG_LEVEL=warn \
            plateia-api:ci
          for attempt in $(seq 1 90); do
            curl -fs http://localhost:8080/health > /dev/null && { echo "gateway ready"; exit 0; }
            sleep 1
          done
          echo "The container never became healthy"
          exit 1

      - run: npm ci

      - name: Smoke test through the gateway
        env:
          CATALOG_URL: http://localhost:8080/api/catalog
          BOOKING_URL: http://localhost:8080/api/booking
          BACKOFFICE_URL: http://localhost:8080/api/backoffice
        run: npm run smoke

      # Browser tests on the same running image: the static site Vercel publishes,
      # served with /api proxied to the gateway (e2e/serve.mjs mirrors vercel.json).
      - name: Build the production web site
        run: npm run build:web:prod

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: End-to-end browser tests (Playwright)
        env:
          E2E_API_URL: http://127.0.0.1:8080
        run: npm run e2e

      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Memory used by the container
        if: always()
        run: docker stats --no-stream --format '{{.MemUsage}}' api || true

      - name: Container logs
        if: failure()
        run: docker logs api 2>&1 | tail -200
