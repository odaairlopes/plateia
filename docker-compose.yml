# Local infrastructure only. Host ports are shifted (5433/6380) so they do not
# clash with a Postgres/Redis already running on the machine.
name: plateia

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-plateia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-plateia}
      POSTGRES_DB: ${POSTGRES_DB:-plateia}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Local SMTP server that captures every email instead of delivering it.
  # Inbox UI: http://localhost:8025 . Services send to it by default.
  mailpit:
    image: axllent/mailpit:v1.34.0
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 3s
      timeout: 3s
      retries: 20

  # --- Observability stack: `npm run obs:up` (compose profile "observability") ---
  # Services export OTLP to the collector, which fans out to Jaeger (traces)
  # and Prometheus (metrics). Grafana reads both. Everything binds to
  # loopback only; this setup is for local development.

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.165.0
    profiles: [observability]
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./infra/observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:4318:4318"
    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/jaeger:2.23.0
    profiles: [observability]
    ports:
      - "127.0.0.1:16686:16686"

  prometheus:
    image: prom/prometheus:v3.16.0
    profiles: [observability]
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    image: grafana/grafana:13.2.6
    profiles: [observability]
    environment:
      # Local convenience: open without a login, read-only. Never do this on a shared host.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/plateia-overview.json
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3030:3000"
    depends_on:
      - prometheus
      - jaeger

volumes:
  postgres-data:
  redis-data:
