# Render Blueprint: the backend (five services + gateway) as one Docker web service.
# Render dashboard -> New -> Blueprint -> pick this repository.
# Values marked "sync: false" are asked for once, in the dashboard (never committed).
services:
  - type: web
    name: plateia-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./deploy/backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Neon (Postgres): the *pooled* connection string, with ?sslmode=require.
      - key: DATABASE_URL
        sync: false
      # Redis Cloud: redis://default:<password>@<host>:<port>
      - key: REDIS_URL
        sync: false
      # Public URL of the site on Vercel, e.g. https://plateia.vercel.app
      - key: APP_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      # Brevo SMTP (Settings -> SMTP & API).
      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      # A sender address verified in Brevo, e.g. "Plateia <you@example.com>"
      - key: MAIL_FROM
        sync: false
      - key: MAIL_MAX_PER_RECIPIENT_PER_DAY
        value: "3"
      - key: MAIL_MAX_PER_DAY
        value: "250"
      # Random secrets generated by Render; never leave the dev defaults in production.
      - key: BACKOFFICE_JWT_SECRET
        generateValue: true
      - key: MAIL_RECIPIENT_HASH_SECRET
        generateValue: true
      # Free tiers: few database connections, small Redis.
      - key: DB_POOL_MAX
        value: "3"
      - key: EVENT_STREAM_MAXLEN
        value: "10000"
      # Vercel -> Render load balancer -> gateway -> service.
      - key: TRUST_PROXY_HOPS
        value: "3"
      - key: SEED_DEMO_ON_START
        value: "true"
      - key: LOG_LEVEL
        value: info
